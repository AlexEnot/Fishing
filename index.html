<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лендинг</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="header">
      <h2>Fishing</h2>
      <nav class="navbar">
        <a>News</a>
        <a>Places</a>
        <a>About Us</a>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-text">
        <h1>Добро пожаловать</h1>
        <p>
          Это демонстрационный лендинг с кастомными шрифтами и фиксированным
          хедером. Здесь используется Arial и Prata.
        </p>
      </div>
      <div class="hero-image">
        <img src="assets/001.png" alt="Изображение" />
      </div>
    </section>

    <footer class="footer">
      <div class="footer-description">
        <p>Fishing</p>
        <div class="social-container">
          <div>
            <img src="./assets/social/fb.svg" alt="" />
          </div>
          <div>
            <img src="./assets/social/in.svg" alt="" />
          </div>
          <div>
            <img src="./assets/social/inst.svg" alt="" />
          </div>
          <div>
            <img src="./assets/social/tel.svg" alt="" />
          </div>
          <div>
            <img src="./assets/social/tik.svg" alt="" />
          </div>
          <div>
            <img src="./assets/social/yout.svg" alt="" />
          </div>
        </div>
        <div></div>
      </div>
      <div class="footer-terms">
        <a>© 2024, Copyright.</a>
        <a class="policy">Privacy policy</a>
        <a class="terms">Terms of Use</a>
      </div>
    </footer>

    <script>
      (function () {
        const header = document.getElementById("header");
        let lastScroll = 0;
        let ticking = false;

        function updateHeader() {
          const currentScroll =
            window.pageYOffset || document.documentElement.scrollTop;

          // Всегда применяем размытие при скролле вниз
          if (currentScroll > 60) {
            header.classList.add("scrolled");

            // Форсируем рефлоу для активации размытия
            void header.offsetHeight;
          }
          // Убираем только при возврате в самый верх
          else if (currentScroll <= 10) {
            header.classList.remove("scrolled");
          }

          lastScroll = currentScroll;
          ticking = false;
        }

        function onScroll() {
          if (!ticking) {
            window.requestAnimationFrame(updateHeader);
            ticking = true;
          }
        }

        // Вешаем несколько обработчиков
        window.addEventListener("scroll", onScroll, { passive: true });
        window.addEventListener("resize", onScroll);

        // Инициализация
        updateHeader();

        // Фикс для Safari
        setTimeout(updateHeader, 300);
      })();
    </script>
  </body>
</html>
